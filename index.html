<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e0a">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
<title>Kasirku</title>
<link rel="prefetch" href="dashboard.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --ink:#121411; --lime:#c8f560; --lime-dark:#b5e348; --bg:#ffffff;
  --dark-a:#252922; --dark-b:#171a14; --dark-c:#0c0e0a;
  --tile:108px; --R:106px;
  --out:cubic-bezier(.16,1,.3,1); --pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--dark-c)}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}

.stage{
  position:fixed;inset:0;overflow:hidden;isolation:isolate;display:grid;place-items:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:
    radial-gradient(120% 90% at 100% 0%,rgba(200,245,96,.14) 0%,rgba(200,245,96,0) 55%),
    linear-gradient(160deg,var(--dark-a) 0%,var(--dark-b) 48%,var(--dark-c) 100%);
}

/* ===== latar ===== */
.dots{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(200,245,96,.22) 1.2px,transparent 1.8px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 38%,transparent 68%);
          mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 38%,transparent 68%);
  opacity:0;animation:fade 1.4s .1s ease forwards;
}
.glow{
  position:absolute;left:50%;top:42%;width:560px;height:560px;margin:-280px 0 0 -280px;pointer-events:none;
  background:radial-gradient(circle,rgba(200,245,96,.20) 0%,rgba(200,245,96,.06) 38%,transparent 66%);
  opacity:0;animation:fade 1.6s .2s ease forwards,breathe 4.5s 1.8s ease-in-out infinite;
}
.pts{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.pt{position:absolute;bottom:-12px;border-radius:50%;background:var(--lime);opacity:0;animation:floatUp linear infinite}

/* ===== konten ===== */
.center{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;margin-top:-40px;transition:transform .6s ease}
.logo{position:relative;width:var(--tile);height:var(--tile)}

.ripple{
  position:absolute;inset:0;border-radius:34px;border:1.5px solid var(--lime);opacity:0;z-index:0;
  animation:ripple 3.2s var(--out) infinite;
}
.ripple:nth-child(2){animation-delay:1.05s}.ripple:nth-child(3){animation-delay:2.1s}
.logo .ripple{animation-delay:calc(1.35s + var(--d,0s))}

.tile{
  position:absolute;inset:0;z-index:2;border-radius:34px;overflow:hidden;
  background:linear-gradient(145deg,#ddff85 0%,var(--lime) 46%,var(--lime-dark) 100%);
  border:1.5px solid rgba(255,255,255,.35);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -6px 14px rgba(120,160,20,.35),0 24px 50px -12px rgba(200,245,96,.5),0 0 0 6px rgba(200,245,96,.08);
  display:grid;place-items:center;
  transform:scale(.3) rotate(-14deg);opacity:0;animation:tileIn .9s .15s var(--pop) forwards;
}
.tile::after{ /* kilau */
  content:'';position:absolute;top:-20%;left:-60%;width:40%;height:140%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-18deg);animation:sheen 1.1s 1.15s ease forwards;
}
.tile i{
  font-size:48px;color:var(--ink);filter:drop-shadow(0 2px 0 rgba(255,255,255,.35));
  opacity:0;transform:translateY(10px) scale(.6);animation:iconIn .7s .65s var(--pop) forwards,ding 0.5s 1.35s ease;
}

/* ===== orbit ikon ===== */
.orbit{position:absolute;left:50%;top:50%;width:0;height:0;z-index:1;animation:spin 26s linear infinite;transition:opacity .35s,transform .5s}
.orbit-ring{
  position:absolute;left:50%;top:50%;width:calc(var(--R)*2);height:calc(var(--R)*2);margin:calc(var(--R)*-1) 0 0 calc(var(--R)*-1);
  border-radius:50%;border:1px dashed rgba(200,245,96,.22);pointer-events:none;
  opacity:0;transform:scale(.6);animation:ringIn 1.2s 1.2s var(--out) forwards;
}
.slot{position:absolute;left:0;top:0;transform:rotate(var(--a)) translateX(var(--R)) rotate(calc(var(--a)*-1))}
.chip{
  width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:14px;display:grid;place-items:center;
  color:var(--lime);font-size:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 8px 18px -6px rgba(0,0,0,.6);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:unspin 26s linear infinite;
}
.chip i{opacity:0;transform:scale(0);animation:chipIn .6s var(--pop) forwards;animation-delay:calc(1.45s + var(--i)*.12s)}
.chip{opacity:0;animation:unspin 26s linear infinite,fade .5s forwards;animation-delay:0s,calc(1.4s + var(--i)*.12s)}

/* ===== teks ===== */
.word{margin-top:calc(var(--R) - var(--tile)/2 + 34px);display:flex;font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1.1;color:#f8faf3}
.word .clip{display:inline-block;overflow:hidden;padding:0 .5px .14em}
.word .ch{display:inline-block;transform:translateY(118%);animation:rise .75s var(--out) forwards}
.tag{margin-top:8px;font-size:14px;font-weight:500;color:#9aa093;letter-spacing:.2px;opacity:0;transform:translateY(8px);animation:rise2 .8s 1.9s ease forwards}
.tag b{color:var(--lime);font-weight:600}
.word,.tag{transition:opacity .3s ease,transform .4s ease}

/* ===== loading ===== */
.load{
  position:absolute;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom) + 46px);width:200px;margin-left:-100px;
  opacity:0;animation:fade .6s 1.5s ease forwards;transition:opacity .3s;
}
.load .row{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#9aa093;margin-bottom:9px}
.load .row b{color:#f8faf3;font-weight:800;font-variant-numeric:tabular-nums}
.track{height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.track i{display:block;height:100%;width:100%;border-radius:inherit;transform:scaleX(0);transform-origin:left;
  background:linear-gradient(90deg,var(--lime-dark),var(--lime));box-shadow:0 0 12px rgba(200,245,96,.7)}

/* ===== transisi keluar ===== */
.wipe{position:fixed;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;transform:scale(0);will-change:transform}
.wipe.lime{background:var(--lime);z-index:1}
.wipe.paper{background:var(--bg);z-index:5}
.leaving .word,.leaving .tag{opacity:0;transform:translateY(-10px)}
.leaving .load,.leaving .dots,.leaving .glow,.leaving .pts,.leaving .ripple{opacity:0!important;transition:opacity .35s}
.leaving .orbit{opacity:0;transform:scale(.4)}

@keyframes fade{to{opacity:1}}
@keyframes tileIn{to{transform:scale(1) rotate(0);opacity:1}}
@keyframes iconIn{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ding{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg) scale(1.08)}60%{transform:rotate(7deg)}}
@keyframes sheen{to{left:130%}}
@keyframes ripple{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.9)}}
@keyframes ringIn{to{opacity:1;transform:scale(1)}}
@keyframes chipIn{to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unspin{to{transform:rotate(-360deg)}}
@keyframes rise{to{transform:translateY(0)}}
@keyframes rise2{to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.75}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:.55}85%{opacity:.25}100%{transform:translateY(-105vh);opacity:0}}

@media (max-width:360px){:root{--tile:94px;--R:92px}.word{font-size:38px}.chip{width:36px;height:36px;margin:-18px 0 0 -18px;font-size:14px}}
@media (max-height:600px){.center{margin-top:-10px}}
@media (prefers-reduced-motion:reduce){.stage *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Kasirku">
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="pts" id="pts"></div>
  <div class="wipe lime" id="wipeLime"></div>

  <div class="center">
    <div class="logo" id="logo">
      <div class="ripple"></div><div class="ripple" style="--d:1.05s"></div><div class="ripple" style="--d:2.1s"></div>

      <div class="orbit">
        <div class="orbit-ring"></div>
        <div class="slot" style="--a:0deg"><div class="chip" style="--i:0"><i class="fas fa-receipt"></i></div></div>
        <div class="slot" style="--a:60deg"><div class="chip" style="--i:1"><i class="fas fa-coins"></i></div></div>
        <div class="slot" style="--a:120deg"><div class="chip" style="--i:2"><i class="fas fa-chart-line"></i></div></div>
        <div class="slot" style="--a:180deg"><div class="chip" style="--i:3"><i class="fas fa-boxes-stacked"></i></div></div>
        <div class="slot" style="--a:240deg"><div class="chip" style="--i:4"><i class="fas fa-qrcode"></i></div></div>
        <div class="slot" style="--a:300deg"><div class="chip" style="--i:5"><i class="fas fa-wallet"></i></div></div>
      </div>

      <div class="tile"><i class="fas fa-cash-register"></i></div>
    </div>

    <h1 class="word" id="word" aria-label="Kasirku"></h1>
    <p class="tag">Jualan lancar, <b>catatan rapi.</b></p>
  </div>

  <div class="load" aria-hidden="true">
    <div class="row"><span id="msg">Menyiapkan kasir…</span><b id="pct">0%</b></div>
    <div class="track"><i id="fill"></i></div>
  </div>

  <div class="wipe paper" id="wipePaper"></div>
</main>

<script>
(function(){
  var TARGET='dashboard.html';
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $=function(id){return document.getElementById(id)};

  /* wordmark */
  var word=$('word'),t='Kasirku';
  for(var i=0;i<t.length;i++){
    var c=document.createElement('span');c.className='clip';
    var s=document.createElement('span');s.className='ch';s.textContent=t[i];
    s.style.animationDelay=(1.1+i*.06)+'s';
    c.appendChild(s);word.appendChild(c);
  }

  /* partikel melayang */
  var box=$('pts');
  if(!reduce)for(var k=0;k<18;k++){
    var p=document.createElement('span'),sz=2+Math.random()*3.5;
    p.className='pt';
    p.style.cssText='left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;animation-duration:'+(7+Math.random()*8)+'s;animation-delay:-'+(Math.random()*12)+'s;opacity:0';
    box.appendChild(p);
  }

  /* progres + status */
  var msgs=[[0,'Menyiapkan kasir…'],[35,'Memuat menu & stok…'],[72,'Hampir siap…'],[100,'Siap berjualan!']];
  var fill=$('fill'),pct=$('pct'),msg=$('msg'),last=-1;
  var T0=performance.now()+(reduce?0:1500),DUR=reduce?300:2300,started=false;
  function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
  function tick(now){
    if(started)return;
    var x=Math.min(Math.max((now-T0)/DUR,0),1),v=Math.round(ease(x)*100);
    fill.style.transform='scaleX('+(v/100)+')';
    if(v!==last){
      pct.textContent=v+'%';last=v;
      for(var j=msgs.length-1;j>=0;j--){if(v>=msgs[j][0]){if(msg.textContent!==msgs[j][1])msg.textContent=msgs[j][1];break}}
    }
    if(x<1)requestAnimationFrame(tick);else setTimeout(go,420);
  }
  requestAnimationFrame(tick);

  /* transisi: logo -> lingkaran lime -> warna dashboard -> pindah */
  var stage=$('stage'),logo=$('logo'),wl=$('wipeLime'),wp=$('wipePaper');
  function go(){
    if(started)return;started=true;
    var r=logo.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var rad=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy))+40;
    var full=rad*2/20,start=r.width/20*.98;
    [wl,wp].forEach(function(e){e.style.left=cx+'px';e.style.top=cy+'px'});
    stage.classList.add('leaving');
    wl.style.transform='scale('+start+')';void wl.offsetWidth;
    wl.style.transition='transform .8s cubic-bezier(.7,0,.2,1)';
    wl.style.transform='scale('+full+')';
    setTimeout(function(){
      wp.style.transform='scale('+start+')';void wp.offsetWidth;
      wp.style.transition='transform .75s cubic-bezier(.7,0,.2,1)';
      wp.style.transform='scale('+full+')';
    },260);
    setTimeout(function(){location.replace(TARGET)},1100);
  }
  stage.addEventListener('click',go);
})();
</script>
</body>
</html>
